<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cssfiles/common.css">
    <link rel="stylesheet" href="cssfiles/details.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Protest+Riot&display=swap" rel="stylesheet">
    <title>Hotel details Page</title>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hotel-icon lucide-hotel"><path d="M10 22v-6.57"/><path d="M12 11h.01"/><path d="M12 7h.01"/><path d="M14 15.43V22"/><path d="M15 16a5 5 0 0 0-6 0"/><path d="M16 11h.01"/><path d="M16 7h.01"/><path d="M8 11h.01"/><path d="M8 7h.01"/><rect x="4" y="2" width="16" height="20" rx="2"/></svg>
                StayHub
            </div>
        </div>
        <div class="nav-toggle">
            <div class="hamburger">
                <svg id="hambar" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
            </div>
        </div>
        <ul class="nav-menu">
            <div class="menu-close">
                <svg id="close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </div>
            <li class="menu-item"><a href="index.html?#home" class="active">Home</a></li>
            <li class="menu-item"><a href="hotels.html">Hotels</a></li>
            <li class="menu-item"><a href="index.html?#destinations">Destinations</a></li>
            <li class="menu-item" id="bookings-link" style="display: none;">
        <a href="#">My Bookings</a>
    </li>
            <li class="menu-item"><a href="#about">About</a></li>
            <li id="loginbtn" class="menu-item"><a href="#">Login</a></li>
        </ul>

        <a href="#" class="loginout">Login</a>
    </nav>
    <main class="hotel-details">
        <section class="gallery-booking">
            <div class="main-img">
                <!--cover-image-->
            </div>
            <div class="other-images">
                <!--room-->
                <!--restaurant-->
            </div>
            <section class="hotel-head">
            <div class="hotel-title">
                <!--Name-->
                <!--City-->
                <!--ratings-->
            </div>
            <div class="hotel-desc">
                <h2>About this hotel</h2>
                <!--about hotel-->
            </div>
            
        </section>
            <aside class="booking-card">
                <div class="bcardleft">
                <div class="priceNight">
                    <div class="pricetag">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-indian-rupee-icon lucide-indian-rupee"><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/></svg>
                    <span id="price-per-night"></span>
                    <span id="perN">/night</span></div>
                    <p id="taxfee">+taxes and fees</p>
                </div>
                <div class="booking-dates">
                    <!--check-IN-->
                    <!--check-OUT-->
                    <div class="dates">
                        <label for="checkin">Check In:</label>
                        <input type="date" id="checkin">
                    </div>
                    <div class="dates">
                        <label for="checkout">Check Out:</label>
                        <input type="date" id="checkout">
                    </div>
                </div>
                <div class="dates-alerting" style="display:none"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info-icon lucide-info"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        <p class="dates-alert-msg">Select CheckIn and CheckOut dates</p>
                    </div>
                </div>
                <div class="bcardright">
                <div class="booking-room-info">
                    <div class="room-count">
                        <label for="rooms">Rooms:</label>
                        <input type="number" id="rooms" min="1" value="1">
                    </div>
                    <div class="booking-guests">
                        <!--no.of guests-->
                        <p>Guests:</p>
                        <span id="guestCount"></span>
                    </div>
                </div>
                <div class="booking-price">
                    <hr id="dashed-line">
                    <div class="totalprice"><p class="total-head">Total:</p>
                    <!--room price-->
                    <p class="finalprice"> <svg id="rupee" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-indian-rupee-icon lucide-indian-rupee"><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/></svg>
                    <p id="price-val"></p></p></div>
                    <hr id="dashed-line">
                </div>
                <button class="book-now">Book Now</button>
            </div>
            </aside>
        </section>
        
        <section class="hotel-info">
            <div class="info-top">
                <div class="hotel-amenities">
                <!--amenities-->
                <h2>Amenities</h2>
                <div class="amenities-list"></div>
                </div>
                <aside class="hotel-ratings">
                    <div class="rat-rev-head">
                        <h2>Ratings</h2>
                    </div>
                    <!--ratings-->
                    <!--reviews-->
                    <div class="rating-list"></div>
                </aside>
            </div>
            <div class="room-cards">
                <!--room image-->
                <!--room-type-->
                <!--room-guests-->
                <!--bed-->
                <!--breakfast-->
                <!--refundable-->
                <!--price-->
            </div>
        </section>
        <section class="similar-hotels">
            <h2>Similar Hotels</h2>
            <div class="hotel-cards">
                <!--cards-->
            </div>
        </section>
    </main>

    <script type="module" src="jsfiles/details.js"></script>

</body>
</html>
