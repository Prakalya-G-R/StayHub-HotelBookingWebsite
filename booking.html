    <div class="booking-container">
        <div class="stepper">
            <div class="step active"><span>1</span>Details</div>
            <div class="line"></div>
            <div class="step"><span>2</span>Payment</div>
            <div class="line"></div>
            <div class="step"><span>3</span>Confirmation</div>
        </div>

        <!-- Step 1 -->
        <div class="booking-layout">
        <div class="booking-left">
        <section class="step-content active" id="details">
            <div class="alert-info">
                <p class="alert-qn">Who's checking in?</p>
                <p class="alert-cap"><span id="note-head">Note: </span>This should match the ID that you'll bring at check-in
            </div>
            <form class="guest-form">
                <div class="name">
                    <div class="first-name">
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" placeholder="e.g. Aarav" minlength="2" pattern="[A-Za-z ]+" title="Letters only, min 2 characters" required>
                    </div>
                    <div class="last-name">
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="last-name" placeholder="e.g. Sharma">
                    </div>
                </div>
                <div class="email">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                </div>
                <div class="phone-det">
                    <div class="code">
                        <label for="country-code">Code:</label>
                        <select id="country-code">
                            <option value="+91" selected>🇮🇳 India (+91)</option>
                            <option value="+1">🇺🇸 United States (+1)</option>
                            <option value="+44">🇬🇧 United Kingdom (+44)</option>
                            <option value="+61">🇦🇺 Australia (+61)</option>
                            <option value="+971">🇦🇪 UAE (+971)</option>
                            <option value="+65">🇸🇬 Singapore (+65)</option>
                            <option value="+49">🇩🇪 Germany (+49)</option>
                            <option value="+33">🇫🇷 France (+33)</option>
                            <option value="+81">🇯🇵 Japan (+81)</option>
                            <option value="+86">🇨🇳 China (+86)</option>
                            <option value="+60">🇲🇾 Malaysia (+60)</option>
                            <option value="+66">🇹🇭 Thailand (+66)</option>
                            <option value="+94">🇱🇰 Sri Lanka (+94)</option>
                            <option value="+977">🇳🇵 Nepal (+977)</option>
                            <option value="+880">🇧🇩 Bangladesh (+880)</option>
                            <option value="+92">🇵🇰 Pakistan (+92)</option>
                            <option value="+974">🇶🇦 Qatar (+974)</option>
                            <option value="+966">🇸🇦 Saudi Arabia (+966)</option>
                            <option value="+968">🇴🇲 Oman (+968)</option>
                            <option value="+64">🇳🇿 New Zealand (+64)</option>
                        </select>
                    </div>
                    <div class="phone-no">
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phone" required pattern="\d{10}" placeholder="1234567890" title="Enter a valid 10-digit number" maxlength="10">
                    </div>
                </div>
                <div class="special-req">
                    <label for="special-requests">Special Requests <span>(optional)</span></label>
                    <textarea id="special-requests" name="special-requests" placeholder="High floor, early check-in, etc."></textarea>
                </div>
            </form>
            <button class="next-btn">Continue</button>
        </section>

        <!-- Step 2 -->
        <section class="step-content" id="payment">
            <!-- Payment Form -->
            <div class="payment-head">
                <p class="payment-head">Payment details</p>
            </div>
            <div class="payment-section">
                <div class="payment-methods">
                    <button class="method active" data-target="card">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card preview-icon"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></svg>
                        <p id="method-name">Card</p>
                    </button>

                    <button class="method" data-target="upi">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-landmark preview-icon"><path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></svg>
                        <p id="method-name">UPI</p>
                    </button>

                    <button class="method" data-target="netbanking">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-building-complex preview-icon"><path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/></svg>
                        <p id="method-name">Net Banking</p>
                    </button>
                </div>

                    <!--Card-->
